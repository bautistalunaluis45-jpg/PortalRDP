# Perfil de desarrollo (activar con SPRING_PROFILES_ACTIVE=dev).
# Los datos semilla de demo los carga SeedDevRunner (no Flyway), para que el
# historial de migraciones sea identico en todos los entornos.

# En dev no hay agente real que renueve el latido, asi que usamos un umbral muy
# grande para que las PCs con latido sembrado se vean LIBRES (las de latido nulo
# se ven SIN_CONEXION). En produccion vale el valor por defecto (90 s).
portal.estado.sin-conexion-tras-segundos=31536000

# Clave de cifrado SOLO para desarrollo (no usar en produccion).
portal.cifrado.clave-base64=N5zFQ2LpwftSisk7iMR2rLhYaQgVUmfxb+hcd3NROMI=

# Util al desarrollar.
spring.jpa.show-sql=true
logging.level.org.flywaydb=info
