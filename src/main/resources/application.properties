spring.application.name=portal-rdp

# Base de datos.
# Valores por defecto para desarrollo local contra docker-compose.
# En otros entornos se sobreescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_rdp}
spring.datasource.username=${DB_USER:portal}
spring.datasource.password=${DB_PASSWORD:portal}

# Flyway es dueno del esquema; Hibernate solo valida que las entidades
# coincidan con las tablas migradas (nunca modifica el esquema).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El portal corre detras del proxy TLS de Tailscale Serve (termina HTTPS y
# reenvia por HTTP con cabeceras X-Forwarded-*). Esto hace que Spring reconstruya
# las URLs como https (necesario para que el redirect_uri de OAuth coincida).
# En acceso directo (sin proxy) no hay cabeceras X-Forwarded y no tiene efecto.
# Seguridad: el puerto local debe quedar accesible solo por el proxy
# (arrancar con server.address=127.0.0.1 en ese despliegue).
server.forward-headers-strategy=framework

# Flyway: solo migraciones versionadas. Los datos de demo NO se cargan aqui
# (ver el perfil dev en application-dev.properties).
spring.flyway.locations=classpath:db/migration

# Login con Google (OIDC).
# El proveedor "google" ya lo conoce Spring (URIs y scopes openid/profile/email).
# NO se declara la registracion aqui con valores vacios: Boot valida que el
# client-id no este vacio y romperia el arranque (incluido el perfil dev, que
# usa login simulado). En produccion se pasan por variables de entorno:
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=...
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=...

# Restriccion OPCIONAL por dominio (separados por coma). Vacio (por defecto) =
# sin restriccion de dominio: el unico filtro es el alta previa del usuario.
# Para restringir, p. ej.: PORTAL_DOMINIOS=healthcarepi.com
portal.auth.dominios-permitidos=${PORTAL_DOMINIOS:}

# Clave de cifrado AES (32 bytes en base64 = AES-256), por variable de entorno.
# Protege la contrasena de la cuenta dedicada de cada PC. Sin ella el portal no arranca.
portal.cifrado.clave-base64=${PORTAL_CIFRADO_CLAVE:}

# Descarga del agente: ruta al .exe publicado del agente (se sirve a las PCs destino).
# Vacio = aun no publicado (la descarga responde 404 con aviso).
portal.agente.archivo=${PORTAL_AGENTE_ARCHIVO:}
portal.agente.version=${PORTAL_AGENTE_VERSION:1.0.0}
