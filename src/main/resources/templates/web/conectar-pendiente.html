<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Conectar — Portal RDP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased" style="font-family:Inter,sans-serif">
<main class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <div class="max-w-md w-full bg-white rounded-xl shadow p-8 flex flex-col items-center text-center gap-4">
    <span class="material-symbols-outlined text-5xl text-blue-700">rocket_launch</span>
    <h1 class="text-xl font-semibold text-slate-900">Lanzamiento aún no disponible</h1>
    <p class="text-slate-600 text-sm">
      El botón <strong>Conectar</strong> abrirá la sesión RDP mediante el helper (mstsc) en una
      fase posterior del proyecto. La visibilidad y el estado de las computadoras ya funcionan.
    </p>
    <a th:href="@{/web/mis-computadoras}"
       class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-700 text-white text-sm font-semibold hover:opacity-90">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      Volver a mis computadoras
    </a>
  </div>
</main>
</body>
</html>
