<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Tarjeta de una computadora. Parametro: c (ComputadoraVista). -->
<div th:fragment="tarjeta(c)"
     class="group relative flex flex-col justify-between bg-surface-container-lowest rounded-xl p-space-lg shadow-sm transition-all duration-200 h-full border"
     th:classappend="${c.esOcupada()} ? 'border-amber-300/60' : (${c.esSinConexion()} ? 'border-outline-variant/40 opacity-90' : 'border-outline-variant/30 hover:shadow-md')">
  <div class="flex flex-col gap-space-md">

    <!-- Fila de vigencia (solo acceso temporal) -->
    <div th:if="${c.temporal()}" class="flex items-center justify-between border-b pb-space-xs border-surface-container">
      <span class="inline-flex items-center gap-1 font-label-sm text-label-sm text-primary font-medium">
        <span class="material-symbols-outlined text-sm">hourglass_top</span>
        <span th:text="${c.etiquetaVigencia()}">Vence pronto</span>
      </span>
    </div>

    <!-- Encabezado: icono + nombre + estado -->
    <div class="flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-sm min-w-0">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0"
             th:classappend="${c.esOcupada()} ? 'bg-amber-50 text-amber-700 border border-amber-200/50' : 'bg-surface-container text-primary'">
          <span class="material-symbols-outlined text-2xl">desktop_windows</span>
        </div>
        <div class="flex flex-col min-w-0">
          <h3 class="font-headline-sm text-headline-sm text-on-surface truncate font-semibold" th:text="${c.nombre()}">WS-DIS-01</h3>
        </div>
      </div>

      <span th:if="${c.esLibre()}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-tertiary-container/15 text-tertiary font-label-sm text-label-sm font-semibold flex-shrink-0">
        <span class="w-2 h-2 rounded-full bg-tertiary"></span>Libre
      </span>
      <span th:if="${c.esOcupada()}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 font-label-sm text-label-sm font-semibold flex-shrink-0">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span>Ocupada
      </span>
      <span th:if="${c.esSinConexion()}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm font-semibold flex-shrink-0">
        <span class="w-2 h-2 rounded-full bg-outline"></span>Sin conexión
      </span>
    </div>

    <!-- Linea informativa segun estado -->
    <div th:if="${c.esLibre()}" class="py-space-xs px-space-sm rounded-lg bg-surface-container-low flex items-center gap-space-xs text-on-surface-variant">
      <span class="material-symbols-outlined text-tertiary text-base">check_circle</span>
      <span class="font-body-sm text-body-sm">Disponible para conexión inmediata</span>
    </div>
    <div th:if="${c.esOcupada()}" class="py-space-xs px-space-sm rounded-lg bg-amber-50/70 border border-amber-200/70 flex items-center gap-space-xs text-amber-950">
      <span class="material-symbols-outlined text-amber-700 text-base">person</span>
      <span class="font-body-sm text-body-sm text-amber-900 truncate">En uso por: <strong class="font-semibold text-amber-950" th:text="${c.usuarioEnUso()}">—</strong></span>
    </div>
    <div th:if="${c.esSinConexion()}" class="py-space-xs px-space-sm rounded-lg bg-surface-container-low flex items-center gap-space-xs text-on-surface-variant">
      <span class="material-symbols-outlined text-base">cloud_off</span>
      <span class="font-body-sm text-body-sm">La PC no reporta conexión</span>
    </div>
  </div>

  <!-- Boton Conectar (solo si esta libre) -->
  <div class="pt-space-md mt-space-md border-t border-surface-container flex items-center">
    <form th:if="${c.puedeConectar()}" method="post" class="w-full"
          th:action="@{/web/mis-computadoras/{id}/conectar(id=${c.id()})}">
      <button type="submit"
              class="w-full inline-flex items-center justify-center gap-space-xs px-space-md py-2.5 rounded-lg bg-primary-container text-on-primary font-headline-sm text-headline-sm hover:opacity-90 active:scale-95 transition-all shadow-sm">
        <span>Conectar</span>
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </button>
    </form>
    <button th:unless="${c.puedeConectar()}" disabled
            class="w-full inline-flex items-center justify-center gap-space-xs px-space-md py-2.5 rounded-lg bg-surface-container text-on-surface-variant border border-outline-variant/40 font-headline-sm text-headline-sm cursor-not-allowed">
      <span class="material-symbols-outlined text-base">lock</span>
      <span th:text="${c.esOcupada()} ? 'Ocupada' : 'Sin conexión'">No disponible</span>
    </button>
  </div>
</div>
</body>
</html>
